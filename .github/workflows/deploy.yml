  deploy-admin-next-shadcn:
    needs: detect-changes
    if: needs.detect-changes.outputs['admin-next-shadcn'] == 'true'
    uses: ./.github/workflows/deploy-static-app.yml
    with:
      app_path: apps/admin-next-shadcn
      build_command: NEXT_TELEMETRY_DISABLED=1 npm run build
      output_dir: out
      target_name: shipping-admin-next-shadcn
    secrets: inherit

  deploy-admin-antd-pro:
    needs: detect-changes
    if: needs.detect-changes.outputs['admin-antd-pro'] == 'true'
    uses: ./.github/workflows/deploy-static-app.yml
    with:
      app_path: apps/admin-antd-pro
      build_command: UMI_ENV=prod NODE_OPTIONS=--max-old-space-size=4096 npm run build
      output_dir: dist
      target_name: shipping-admin-antd-pro
    secrets: inherit

  deploy-admin-mui:
    needs: detect-changes
    if: needs.detect-changes.outputs['admin-mui'] == 'true'
    uses: ./.github/workflows/deploy-static-app.yml
    with:
      app_path: apps/admin-mui
      build_command: npm run build
      output_dir: dist
      target_name: shipping-admin-mui
    secrets: inherit
