name: Deploy

on:
  push:
    branches:
      - trial/cicd

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api:                ${{ steps.filter.outputs.api }}
      front_sh:           ${{ steps.filter.outputs.front_sh }}
      admin-next-shadcn:  ${{ steps.filter.outputs.admin-next-shadcn }}
      admin-antd-pro:     ${{ steps.filter.outputs.admin-antd-pro }}
      admin-ui:           ${{ steps.filter.outputs.admin-ui }}
      admin-mui:          ${{ steps.filter.outputs.admin-mui }}
      # admin-horizon-ui:   ${{ steps.filter.outputs.admin-horizon-ui }}
      # admin-square-ui:    ${{ steps.filter.outputs.admin-square-ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            front_sh:
              - 'front.sh'
            admin-next-shadcn:
              - 'apps/admin-next-shadcn/**'
            admin-antd-pro:
              - 'apps/admin-antd-pro/**'
            admin-ui:
              - 'apps/admin-ui/**'
            admin-mui:
              - 'apps/admin-mui/**'
            # admin-horizon-ui:
            #   - 'apps/admin-horizon-ui/**'
            # admin-square-ui:
            #   - 'apps/admin-square-ui/**'

  deploy-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment variables
        id: resolve
        env:
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_SECRET: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_VAR: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER_VAR: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH_VAR: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${DEPLOY_HOST_SECRET:-}"
          DEPLOY_USER="${DEPLOY_USER_SECRET:-}"
          DEPLOY_PATH="${DEPLOY_PATH_SECRET:-}"

          [ -n "${DEPLOY_HOST}" ] || DEPLOY_HOST="${DEPLOY_HOST_VAR:-}"
          [ -n "${DEPLOY_USER}" ] || DEPLOY_USER="${DEPLOY_USER_VAR:-}"
          [ -n "${DEPLOY_PATH}" ] || DEPLOY_PATH="${DEPLOY_PATH_VAR:-}"

          {
            echo "deploy_host=${DEPLOY_HOST}"
            echo "deploy_user=${DEPLOY_USER}"
            echo "deploy_path=${DEPLOY_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        run: |
          missing=()

          [ -n "${{ steps.resolve.outputs.deploy_host }}" ] || missing+=("DEPLOY_HOST")
          [ -n "${{ steps.resolve.outputs.deploy_user }}" ] || missing+=("DEPLOY_USER")
          [ -n "${{ steps.resolve.outputs.deploy_path }}" ] || missing+=("DEPLOY_PATH")
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing+=("DEPLOY_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deployment configuration: ${missing[*]}"
            echo "::error::Set these as GitHub repository/environment secrets or variables before running deploy."
            exit 1
          fi

      - name: Deploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.resolve.outputs.deploy_host }}
          username: ${{ steps.resolve.outputs.deploy_user }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ steps.resolve.outputs.deploy_path }}
            git pull --ff-only || echo "Warning: pre-deploy git pull skipped"
            ./backend.sh

