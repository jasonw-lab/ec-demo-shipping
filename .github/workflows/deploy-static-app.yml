name: Deploy Static App

on:
  workflow_call:
    inputs:
      app_path:
        required: true
        type: string
      build_command:
        required: true
        type: string
      output_dir:
        required: true
        type: string
      target_name:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '22.22.2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment variables
        env:
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_SECRET: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_VAR: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER_VAR: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${DEPLOY_HOST_SECRET:-}"
          DEPLOY_USER="${DEPLOY_USER_SECRET:-}"

          [ -n "${DEPLOY_HOST}" ] || DEPLOY_HOST="${DEPLOY_HOST_VAR:-}"
          [ -n "${DEPLOY_USER}" ] || DEPLOY_USER="${DEPLOY_USER_VAR:-}"

          {
            echo "DEPLOY_HOST=${DEPLOY_HOST}"
            echo "DEPLOY_USER=${DEPLOY_USER}"
          } >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          missing=()

          [ -n "${DEPLOY_HOST}" ] || missing+=("DEPLOY_HOST")
          [ -n "${DEPLOY_USER}" ] || missing+=("DEPLOY_USER")
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing+=("DEPLOY_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deployment configuration: ${missing[*]}"
            echo "::error::Set these as GitHub repository/environment secrets or variables before running deploy."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Configure npm network retries
        working-directory: ${{ inputs.app_path }}
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set network-timeout 300000

      - name: Install dependencies
        working-directory: ${{ inputs.app_path }}
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail

          attempt=1
          max_attempts=3

          until npm install --no-audit --no-fund --ignore-scripts; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm install failed after ${max_attempts} attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            echo "npm install failed on attempt ${attempt}/${max_attempts}; retrying in ${sleep_seconds}s..."
            attempt=$((attempt + 1))
            sleep "$sleep_seconds"
          done

      - name: Build
        working-directory: ${{ inputs.app_path }}
        run: ${{ inputs.build_command }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Resolve BASEPATH from server
        id: resolve
        run: |
          set -euo pipefail
          BP=$(ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          for f in "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile"; do
            [ -f "$f" ] || continue
            line=$(grep -E '^[[:space:]]*(export[[:space:]]+)?BASEPATH[[:space:]]*=' "$f" 2>/dev/null | tail -n 1 || true)
            [ -n "$line" ] || continue
            value=${line#*=}
            value=${value%\"}; value=${value#\"}
            value=${value%\'}; value=${value#\'}
            printf '%s\n' "$value"
            exit 0
          done
          exit 1
          REMOTE
          )
          if [ -z "${BP:-}" ]; then
            echo "::error::Could not resolve BASEPATH from server (~/.bashrc, ~/.bash_profile, ~/.profile)"
            exit 1
          fi
          echo "Resolved BASEPATH=$BP"
          echo "basepath=$BP" >> "$GITHUB_OUTPUT"

      - name: Deploy build output via rsync
        env:
          BASEPATH: ${{ steps.resolve.outputs.basepath }}
        run: |
          TARGET="${BASEPATH}/nginx/html/${{ inputs.target_name }}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${TARGET}'"
          rsync -avz --delete "${{ inputs.app_path }}/${{ inputs.output_dir }}/" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${TARGET}/"
          echo "=== Deployed: ${{ inputs.target_name }} → ${TARGET} ==="
